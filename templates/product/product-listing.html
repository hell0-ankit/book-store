{% extends "base.html" %} 
{% load static %}
{% block title %}Home {% endblock%}
{% block content %}
<main class="container-custom mx-auto px-4 py-8 flex flex-col lg:flex-row gap-8">
    <section class="flex-1 order-1 lg:order-2">
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="flex flex-col border rounded-xl bg-[var(--bg-card)] border-gray-100 p-5 relative group ">
                <div class="flex justify-between items-start w-full h-8 mb-2">
                    <span class="bg-[var(--mint)] text-[var(--white)] text-[11px] font-bold px-2 py-0.5 rounded-sm">
                    -9%
                    </span>
                    <div class="flex flex-col gap-1 opacity-0 group-hover:opacity-100 transition-opacity duration-300 absolute right-4 top-4 z-20">
                        <a href="#" class="w-8 h-8 border border-[var(--mint)] rounded-full flex items-center justify-center text-[var(--mint)] shadow-sm transition-all duration-300 hover:bg-[var(--pink)] hover:text-white hover:border-[var(--pink)]">
                        <i class="fa-regular fa-heart text-sm"></i>
                        </a>
                        <a href="#" class="w-8 h-8 border border-[var(--mint)] rounded-full flex items-center justify-center text-[var(--mint)] shadow-sm transition-all duration-300 hover:bg-[var(--pink)] hover:text-white hover:border-[var(--pink)]">
                        <i class="fa-solid fa-eye text-sm"></i>
                        </a>
                    </div>
                </div>
                <div class="w-full h-48 flex items-center justify-center relative mb-4">
                    <img src="{% static 'img/book.webp' %}" 
                        alt="Book Title"
                        class="max-h-full max-w-full object-contain transform group-hover:scale-105 transition-transform duration-300">
                </div>
                <div class="flex flex-col flex-grow pt-2">
                    <h3 class="font-bold text-[18px] hover:text-[var(--pink)] transition-colors"> <a href="{% url 'product-detail'  %}">
                        The Whispering Forest Premium Hardcover </a>
                    </h3>
                    <div class="flex items-center gap-2 mb-4">
                        <span class="text-xs line-through text-gray-300 font-medium">₹ 22</span>
                        <span class="text-sm text-[var(--mint)]">20</span>
                    </div>
                    <button class="w-full btn btn-primary text-xs font-bold uppercase tracking-wider py-2.5 rounded transition-colors mt-auto">
                    Add To Cart
                    </button>
                </div>
            </div>
        </div>
    </section>
    <aside class="w-full lg:w-1/4 space-y-6 shrink-0 order-2 lg:order-1 mt-8 lg:mt-0">
        {% include "product/include/side-bar.html" %}
    </aside>
</main>
{% endblock %}

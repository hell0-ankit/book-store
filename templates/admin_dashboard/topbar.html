{% load static %}
<header class="h-16 bg-white backdrop-blur border-b border-pink-100 flex items-center justify-between gap-3 px-4 md:px-6 shrink-0 sticky top-0 z-20 shadow-[0_1px_2px_rgba(255,74,122,0.06)]">

    <div class="flex items-center gap-3 min-w-0">
        <!-- Mobile hamburger -->
        <button id="sidebarOpenBtn"
            class="lg:hidden w-9 h-9 flex items-center justify-center rounded-lg text-heading hover:bg-pink-light hover:text-pink transition shrink-0">
            <i class="fa-solid fa-bars"></i>
        </button>

        <!-- Breadcrumb -->
        <nav class="hidden sm:flex items-center gap-2 text-sm min-w-0">
            <a href="{% url 'dashboard' %}" class="text-body hover:text-pink transition shrink-0">Home</a>
            {% block breadcrumb %}
            <i class="fa-solid fa-chevron-right text-[10px] text-body/40 shrink-0"></i>
            <span class="text-heading font-semibold truncate">{% block breadcrumb_current %}Dashboard{% endblock %}</span>
            {% endblock %}
        </nav>
    </div>

    <!-- Search - desktop only -->
    <div class="hidden md:flex flex-1 max-w-md">
        <form action="" method="GET" class="relative w-full flex items-center">
            <input type="text" name="search" placeholder="Search..." class="w-full bg-white/70 text-[13px] pl-3 pr-9 py-1.5 rounded-full border border-gray-200 outline-none focus:border-[var(--pink)] focus:bg-white transition-all duration-300" />
            <button type="submit" class="absolute right-1 top-1/2 -translate-y-1/2 w-7 h-7 flex items-center justify-center rounded-full bg-[var(--pink)] text-white text-[11px] hover:bg-[var(--pink)]/90 transition-colors shadow-sm">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>
        </form>
    </div>

    <div class="flex items-center gap-1 md:gap-2 shrink-0">

        


        <span class="hidden md:block w-px h-6 bg-pink-100 mx-1"></span>

        <!-- Profile dropdown -->
        <div class="relative" id="profileDropdown">
            <button onclick="document.getElementById('profileMenu').classList.toggle('hidden'); document.getElementById('profileChevron').classList.toggle('rotate-180')"
                class="flex items-center gap-2 py-1 pl-1 pr-1 md:pr-2 rounded-full md:rounded-lg hover:bg-pink-light transition">
                <div class="w-8 h-8 rounded-full bg-mint/15 flex items-center justify-center text-mint text-sm ring-1 ring-mint/20">
                    <i class="fa-solid fa-user"></i>
                </div>
                <span class="hidden md:block text-sm font-medium text-heading max-w-[120px] truncate">{{ request.user.get_full_name|default:request.user.username }}</span>
                <i id="profileChevron" class="fa-solid fa-chevron-down text-[10px] text-body/60 hidden md:block transition-transform"></i>
            </button>

            <div id="profileMenu"
                 class="hidden absolute right-0 mt-2 w-48 bg-white rounded-xl shadow-lg shadow-pink-100/50 border border-pink-100 py-1.5 z-50 overflow-hidden">
                <div class="px-4 py-2 border-b border-pink-100 md:hidden">
                    <p class="text-sm font-semibold text-heading truncate">{{ request.user.get_full_name|default:request.user.username }}</p>
                </div>
                <a href="#" class="flex items-center gap-2.5 px-4 py-2 text-sm text-body hover:bg-pink-light hover:text-pink transition">
                    <i class="fa-solid fa-user w-4"></i>Profile
                </a>
                <a href="#" class="flex items-center gap-2.5 px-4 py-2 text-sm text-body hover:bg-pink-light hover:text-pink transition">
                    <i class="fa-solid fa-key w-4"></i>Change password
                </a>
                <hr class="my-1 border-pink-100">
                <a href="{% url 'logout' %}" class="flex items-center gap-2.5 px-4 py-2 text-sm text-pink hover:bg-pink-light font-medium transition">
                    <i class="fa-solid fa-right-from-bracket w-4"></i>Log out
                </a>
            </div>
        </div>
    </div>
</header>

<script>
    // close profile dropdown on outside click
    document.addEventListener('click', function (e) {
        const menu = document.getElementById('profileMenu');
        const wrapper = document.getElementById('profileDropdown');
        const chevron = document.getElementById('profileChevron');
        if (menu && wrapper && !wrapper.contains(e.target)) {
            menu.classList.add('hidden');
            chevron?.classList.remove('rotate-180');
        }
    });
</script>

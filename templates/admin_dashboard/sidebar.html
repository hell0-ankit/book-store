{% load static %}
<aside id="sidebar"
    class="fixed lg:static inset-y-0 left-0 z-40 w-64 bg-white border-r border-pink-100
           transform -translate-x-full lg:translate-x-0 transition-transform duration-300 ease-in-out
           flex flex-col h-full">

    <!-- Logo -->
    <div class="flex items-center justify-between px-5 h-16 border-b border-pink-100 shrink-0">
        <a href="" class="flex items-center gap-2">
            <div class="w-9 h-9 rounded-lg bg-pink flex items-center justify-center text-white">
                <i class="fa-solid fa-book"></i>
            </div>
            <span class="font-semibold text-heading text-lg">Sona <span class="text-pink">Books</span></span>
        </a>
        <button id="sidebarCloseBtn" class="lg:hidden text-body hover:text-pink">
            <i class="fa-solid fa-xmark text-xl"></i>
        </button>
    </div>

    <!-- Nav -->
    <nav class="flex-1 overflow-y-auto px-3 py-4 space-y-6">

        <div>
            <p class="px-3 text-xs font-semibold uppercase tracking-wider text-body/70 mb-2">Store</p>
            <ul class="space-y-1">
                <li>
                    <a href=""
                       class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium
                              ">
                        <i class="fa-solid fa-gauge w-4"></i>
                        <span>Dashboard</span>
                    </a>
                </li>
                <li>
                    <a href=""
                       class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium
                              ">
                        <i class="fa-solid fa-cart-shopping w-4"></i>
                        <span>Orders</span>
                    </a>
                </li>
                <li>
                    <a href=""
                       class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-body hover:bg-pink-light hover:text-pink">
                        <i class="fa-solid fa-list-check w-4"></i>
                        <span>Order Items</span>
                    </a>
                </li>
                <li>
                    <a href=""
                       class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-body hover:bg-pink-light hover:text-pink">
                        <i class="fa-solid fa-book-open w-4"></i>
                        <span>Books</span>
                    </a>
                </li>
                <li>
                    <a href=""
                       class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-body hover:bg-pink-light hover:text-pink">
                        <i class="fa-solid fa-tags w-4"></i>
                        <span>Categories</span>
                    </a>
                </li>
                <li>
                    <a href=""
                       class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-body hover:bg-pink-light hover:text-pink">
                        <i class="fa-solid fa-feather w-4"></i>
                        <span>Authors</span>
                    </a>
                </li>
            </ul>
        </div>

        <div>
            <p class="px-3 text-xs font-semibold uppercase tracking-wider text-body/70 mb-2">Customers</p>
            <ul class="space-y-1">
                <li>
                    <a href=""
                       class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-body hover:bg-pink-light hover:text-pink">
                        <i class="fa-solid fa-users w-4"></i>
                        <span>Users</span>
                    </a>
                </li>
                <li>
                    <a href=""
                       class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-body hover:bg-pink-light hover:text-pink">
                        <i class="fa-solid fa-location-dot w-4"></i>
                        <span>Addresses</span>
                    </a>
                </li>
            </ul>
        </div>

        <div>
            <p class="px-3 text-xs font-semibold uppercase tracking-wider text-body/70 mb-2">Administration</p>
            <ul class="space-y-1">
                <li>
                    <a href=""
                       class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-body hover:bg-pink-light hover:text-pink">
                        <i class="fa-solid fa-user-group w-4"></i>
                        <span>Groups</span>
                    </a>
                </li>
                <li>
                    <a href=""
                       class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-body hover:bg-pink-light hover:text-pink">
                        <i class="fa-solid fa-file-lines w-4"></i>
                        <span>Log entries</span>
                    </a>
                </li>
            </ul>
        </div>
    </nav>

    <!-- Bottom mint accent card -->
    <div class="p-4 shrink-0">
        <div class="rounded-xl bg-mint/10 border border-mint/30 p-3 text-center">
            <p class="text-xs text-heading font-medium">Need help?</p>
            <a href="#" class="text-xs text-mint font-semibold hover:underline">Visit support</a>
        </div>
    </div>
